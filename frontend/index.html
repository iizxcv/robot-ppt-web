<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSS Spatial Digital Twin — Virtual Command Center</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #0a0a0c;
        color: #ffffff;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        letter-spacing: -0.025em;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input {
        font-family: inherit;
        letter-spacing: -0.02em;
      }

      /* Dynamic Stage Slide-In + Scale-Up Reveal */
      @keyframes stageReveal {
        0% {
          opacity: 0;
          transform: translateX(38px) scale(0.975);
          filter: blur(6px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0px);
        }
      }
      .stage-reveal {
        animation: stageReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR 로보틱스 솔루션 제안서 — 가상 관제 센터</title>
    <style>
      * {
        box-sizing: border-box;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #080a14;
        color: #ffffff;
        font-family: "Malgun Gothic", "맑은 고딕", Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input {
        font-family: inherit;
        letter-spacing: -0.02em;
      }

      /* Dynamic Stage Slide-In + Scale-Up Reveal */
      @keyframes stageReveal {
        0% {
          opacity: 0;
          transform: translateX(38px) scale(0.975);
          filter: blur(6px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0px);
        }
      }
      .stage-reveal {
        animation: stageReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

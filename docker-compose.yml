services:
  robot-ppt-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robot-ppt-backend
    restart: unless-stopped
    privileged: true
    network_mode: host
    env_file:
      - .env
    volumes:
      # 1:1 Host Master Directory Bind Mounts (Zero Data Loss on Container Restart)
      - ./backend/app:/app/app
      - ./docker_master/config:/app/master/config
      - ./docker_master/data:/app/master/data
      - ./docker_master/logs:/app/master/logs

  robot-ppt-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robot-ppt-web
    restart: unless-stopped
    privileged: true
    network_mode: host
    depends_on:
      - robot-ppt-backend
      - robot-ppt-media-relay
    volumes:
      # 1:1 Host Master Nginx & Static Assets Bind Mounts
      - ./docker_master/nginx:/etc/nginx/conf.d
      - ./docker_master/data:/usr/share/nginx/html/master_data:ro

  robot-ppt-media-relay:
    build:
      context: ./media_relay
      dockerfile: Dockerfile
    container_name: robot-ppt-media-relay
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - UPSTREAM_MEDIA_SERVER=http://10.200.30.110:8889
      - RELAY_PORT=8088
    volumes:
      - ./media_relay:/app

